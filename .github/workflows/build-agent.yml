name: Build agent EXE

# Builds the Windows agent so you get a ready-made ntlm-agent.exe without
# needing a local Rust toolchain. The binary appears under the workflow run's
# "Artifacts" section; on a tag it is also attached to the GitHub release.
on:
  # No "paths" filter: it would apply to tag pushes too, and then a version
  # tag would start no run - and so produce no release.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Several pushes in a row would otherwise queue up full runs of this and
# cancel nothing. Only the newest commit per ref is worth building, and
# fewer parallel runs also means fewer throttled action downloads.
concurrency:
  group: build-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # Without write permission the release step cannot create a release (HTTP 403).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ntlm-agent-rs

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache cargo registry and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ntlm-agent-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ntlm-agent-rs/Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --check
        continue-on-error: true

      # Style hints are informative, not blocking: without "-D warnings" they
      # stay warnings and do not turn the run red.
      - name: Clippy
        run: cargo clippy --release --locked
        continue-on-error: true

      # --locked: build exactly the versions in Cargo.lock, never whatever
      # was published last - a release must not pick up a dependency nobody
      # has looked at.
      - name: Build
        run: cargo build --release --locked

      # Parsers for the audit policy and the logon events. Blocking: a wrong
      # mapping here silently puts wrong data into every dashboard.
      - name: Unit tests
        run: cargo test --release --locked

      # winresource needs rc.exe from the Windows SDK. If it is missing, build.rs
      # only prints a warning and the EXE ships without icon or version info -
      # which is exactly what happened, silently. Assert it instead.
      - name: Verify icon and version resource
        shell: pwsh
        run: |
          # Anchored at the workspace root, not relative: this workflow sets a
          # default working-directory of ntlm-agent-rs and the other does not,
          # so a relative path resolves differently in each and doubled the
          # folder in one of them.
          $exe = Join-Path $env:GITHUB_WORKSPACE "ntlm-agent-rs/target/release/ntlm-agent.exe"
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "FileVersion:  '$($vi.FileVersion)'"
          Write-Host "ProductName:  '$($vi.ProductName)'"
          if (-not $vi.FileVersion) {
            Write-Host "::error::no version resource in the EXE - build.rs could not run the resource compiler"
            throw "resource not embedded"
          }
          # An icon lands in the same resource block; a binary with version info
          # but no icon group means set_icon failed on its own.
          $bytes = [IO.File]::ReadAllBytes($exe)
          $hasIcon = $false
          for ($i = 0; $i -lt $bytes.Length - 4; $i++) {
            if ($bytes[$i] -eq 0 -and $bytes[$i+1] -eq 0 -and $bytes[$i+2] -eq 1 -and $bytes[$i+3] -eq 0) { $hasIcon = $true; break }
          }
          Write-Host "icon directory found: $hasIcon"
          Write-Host "resource check passed"

      - name: Upload ntlm-agent.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Named so it cannot be mistaken for the installer: this is the bare
          # console binary, and double-clicking it only flashes a window.
          name: agent-exe-only-not-the-installer
          path: ntlm-agent-rs/target/release/ntlm-agent.exe
          if-no-files-found: error

      # Uses the GitHub CLI, which is preinstalled on the runner, instead of a
      # third-party action. Two reasons: actions referenced anywhere in a
      # workflow are downloaded before the run starts, even when their step is
      # skipped - so every push to main was fetching a release action it never
      # used, and that download is what hit a 429. And one less external
      # dependency in the release path of a security tool is worth having.
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "release $tag does not exist yet - creating it"
            gh release create $tag --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "could not create release $tag" }
          }
          gh release upload $tag "$env:GITHUB_WORKSPACE/ntlm-agent-rs/target/release/ntlm-agent.exe" --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }
          Write-Host "attached to release $tag"
