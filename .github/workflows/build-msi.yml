name: Build MSI installer

# Deliberately a separate workflow from "Build agent". The MSI depends on WiX,
# a resource compiler and a working dialog set - if any of that breaks it must
# not turn the agent build and its release red. The EXE ships either way; the
# MSI is a convenience on top.
on:
  push:
    branches: [main]
    tags: ['v*']
    # No paths filter on purpose. It applies to tag pushes as well, so tagging a
    # commit that happened to touch none of those paths would produce a release
    # with no MSI attached - the same trap the agent workflow already avoids.
    # Duplicate runs are handled by the concurrency group below instead.
  workflow_dispatch:

# Several pushes in a row would otherwise queue up full runs of this and
# cancel nothing. Only the newest commit per ref is worth building, and
# fewer parallel runs also means fewer throttled action downloads.
concurrency:
  group: build-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msi:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build agent
        working-directory: ntlm-agent-rs
        run: cargo build --release --locked

      # The agent now carries its own version resource, but the MSI is told the
      # version explicitly anyway: ProductVersion has stricter rules than a file
      # version, and reading it from Cargo.toml keeps one source of truth.
      # winresource needs rc.exe from the Windows SDK. If it is missing, build.rs
      # only prints a warning and the EXE ships without icon or version info -
      # which is exactly what happened, silently. Assert it instead.
      - name: Verify icon and version resource
        shell: pwsh
        run: |
          # Anchored at the workspace root, not relative: this workflow sets a
          # default working-directory of ntlm-agent-rs and the other does not,
          # so a relative path resolves differently in each and doubled the
          # folder in one of them.
          $exe = Join-Path $env:GITHUB_WORKSPACE "ntlm-agent-rs/target/release/ntlm-agent.exe"
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "FileVersion:  '$($vi.FileVersion)'"
          Write-Host "ProductName:  '$($vi.ProductName)'"
          if (-not $vi.FileVersion) {
            Write-Host "::error::no version resource in the EXE - build.rs could not run the resource compiler"
            throw "resource not embedded"
          }
          # An icon lands in the same resource block; a binary with version info
          # but no icon group means set_icon failed on its own.
          $bytes = [IO.File]::ReadAllBytes($exe)
          $hasIcon = $false
          for ($i = 0; $i -lt $bytes.Length - 4; $i++) {
            if ($bytes[$i] -eq 0 -and $bytes[$i+1] -eq 0 -and $bytes[$i+2] -eq 1 -and $bytes[$i+3] -eq 0) { $hasIcon = $true; break }
          }
          Write-Host "icon directory found: $hasIcon"
          Write-Host "resource check passed"

      - name: Read version
        shell: pwsh
        run: |
          $v = (Select-String -Path ntlm-agent-rs/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if (-not $v) { throw "could not read version from Cargo.toml" }
          "AGENT_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "version: $v"

      # The licence page needs RTF. Converted from LICENSE by a script rather
      # than inline: the conversion is almost entirely backslash handling, and
      # escaping that through YAML into PowerShell into a .NET string produced
      # a wrong result three times. The script is plain Python and is tested.
      - name: Prepare licence RTF
        run: python installer/make-license-rtf.py LICENSE license.rtf

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.*

      # "wix extension add" takes an exact version or none at all - a wildcard
      # like 5.* is rejected outright, unlike "dotnet tool install --version".
      # The extensions ship in lockstep with the toolset, so ask wix what it is
      # and pin that; if the matching build is missing, fall back to latest.
      - name: Add WiX extensions
        shell: pwsh
        run: |
          $raw = (wix --version) | Out-String
          $ver = $raw.Trim().Split('+')[0].Trim()
          Write-Host "wix reports '$($raw.Trim())' -> pinning extensions to $ver"
          foreach ($e in 'WixToolset.UI.wixext', 'WixToolset.Util.wixext') {
            wix extension add -g "$e/$ver"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::$e/$ver not available, taking the latest instead"
              wix extension add -g $e
              if ($LASTEXITCODE -ne 0) { throw "could not add $e" }
            }
          }
          # Informational only. GitHub's pwsh fails a step on the last exit
          # code, so this must not be the final statement.
          wix extension list -g 2>$null | Out-Host
          Write-Host "extensions ready"

      - name: Build MSI
        run: >
          wix build installer/Package.wxs
          -define AgentExe=ntlm-agent-rs/target/release/ntlm-agent.exe
          -define IconFile=assets/ntlm-agent.ico
          -define BannerBmp=assets/msi-banner.bmp
          -define DialogBmp=assets/msi-dialog.bmp
          -define ProductVersion=${{ env.AGENT_VERSION }}
          -define LicenseRtf=license.rtf
          -ext WixToolset.UI.wixext
          -ext WixToolset.Util.wixext
          -arch x64
          -out ntlm-agent.msi

      # A package that installs but does not uninstall is worse than none, so
      # both directions run here before anyone downloads it - together with the
      # security properties of the result: the key stays out of the log, the
      # data folder belongs to Administrators, and http:// is refused.
      - name: Install and uninstall silently
        shell: pwsh
        run: |
          $log = "install.log"
          $secret = "ci-secret-" + [guid]::NewGuid().ToString("N")
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList `
            "/i","ntlm-agent.msi","/qn","/l*v",$log,`
            "COLLECTORURL=https://collector.invalid:8443","APIKEY=$secret"
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "install failed: $($p.ExitCode)" }
          if (-not (Get-Service NtlmAgent -ErrorAction SilentlyContinue)) { throw "service missing" }
          $dir = "$env:ProgramData\NtlmAgent"
          $cfg = "$dir\config.json"
          if (-not (Test-Path $cfg)) { throw "config.json not written" }
          $j = Get-Content $cfg -Raw | ConvertFrom-Json
          if ($j.collector_url -ne "https://collector.invalid:8443") {
            throw "collector_url not applied: $($j.collector_url)"
          }
          if ($j.api_key -ne $secret) { throw "api_key not applied" }
          if (Select-String -Path $log -Pattern $secret -SimpleMatch -Quiet) {
            throw "the API key reached the install log"
          }
          $acl = Get-Acl $dir
          $owner = $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
          if ($owner -ne "S-1-5-32-544") { throw "data folder owner is $owner, not Administrators" }
          if (-not $acl.AreAccessRulesProtected) { throw "data folder still inherits from ProgramData" }
          $sids = $acl.Access | ForEach-Object {
            $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
          } | Sort-Object -Unique
          if (($sids -join ",") -ne "S-1-5-18,S-1-5-32-544") {
            throw "unexpected access on the data folder: $($sids -join ', ')"
          }
          # The service checks its folder on start and stops if it is not
          # trusted - still running means that check passed on real Windows.
          Start-Sleep -Seconds 8
          $st = (Get-Service NtlmAgent).Status
          if ($st -ne "Running") { Get-Content "$dir\agent.log" -ErrorAction SilentlyContinue; throw "service not running: $st" }
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/x","ntlm-agent.msi","/qn"
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          if (Get-Service NtlmAgent -ErrorAction SilentlyContinue) { throw "service survived uninstall" }
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList `
            "/i","ntlm-agent.msi","/qn","COLLECTORURL=http://collector.invalid:8080"
          if ($p.ExitCode -eq 0) { throw "an http:// URL was accepted without ALLOWHTTP=1" }
          if (Get-Service NtlmAgent -ErrorAction SilentlyContinue) { throw "service installed despite http://" }
          Write-Host "install/uninstall OK, key not in the log, data folder locked down, http refused"

      - name: Upload MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # This is the one to download and double-click.
          name: installer-msi-double-click-this
          path: ntlm-agent.msi
          if-no-files-found: error

      # Uses the GitHub CLI, which is preinstalled on the runner, instead of a
      # third-party action. Two reasons: actions referenced anywhere in a
      # workflow are downloaded before the run starts, even when their step is
      # skipped - so every push to main was fetching a release action it never
      # used, and that download is what hit a 429. And one less external
      # dependency in the release path of a security tool is worth having.
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "release $tag does not exist yet - creating it"
            gh release create $tag --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "could not create release $tag" }
          }
          gh release upload $tag "$env:GITHUB_WORKSPACE/ntlm-agent.msi" --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }
          Write-Host "attached to release $tag"
