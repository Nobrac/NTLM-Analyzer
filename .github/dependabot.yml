# Proposes updates as pull requests - the tests run on each one before
# anything is merged. Actions are pinned to commits; Dependabot keeps both the
# commit and the version comment next to it current.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /ntlm-agent-rs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
