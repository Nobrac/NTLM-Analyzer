[package]
name = "ntlm-agent"
version = "2.3.1"
edition = "2021"
description = "NTLM-Analyzer agent (Windows service) - collects NTLM usage data for the NTLM-Analyzer"
license = "GPL-3.0-or-later"

[[bin]]
name = "ntlm-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["native-certs"] } # Windows certificate store for HTTPS (internal CA / AD CS)
roxmltree = "0.20"

# Windows-specific crates (Windows target only)
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
winreg = "0.52"

# Embeds the icon and a version resource into the EXE. Build-time only - it does
# not end up in the shipped binary, and non-Windows builds skip it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
