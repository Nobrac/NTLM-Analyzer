[package]
name = "ntlm-agent"
version = "2.0.0"
edition = "2021"
description = "NTLM-Analyzer Agent (Windows-Dienst) - sammelt NTLM-Nutzungsdaten fuer den NTLM-Analyzer"
license = "GPL-3.0-or-later"

[[bin]]
name = "ntlm-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["native-certs"] } # Windows-Zertifikatspeicher fuer HTTPS (interne CA/AD CS)
roxmltree = "0.20"

# Windows-spezifische Crates (nur fuer das Windows-Target)
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
winreg = "0.52"

# Embeds the icon and a version resource into the EXE. Build-time only - it does
# not end up in the shipped binary, and non-Windows builds skip it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
